
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI phân loại rác</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif !important;
}

body {
  margin: 0;
  padding: 16px 10px;
  background: #f3f5f7;
  color: #222;
}

#app {
  width: 100%;
  max-width: 560px;
  margin: auto;
  padding: 20px;
  background: #fff;
  border-radius: 16px;
}

h1 {
  font-size: 24px;
  text-align: center;
  margin: 2px 0 12px;
  font-weight: 700;
}

.description {
  font-size: 15px;
  text-align: center;
  line-height: 1.5;
  margin-bottom: 18px;
}

#camera {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: #222;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}

#preview {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}

#placeholder {
  color: white;
  font-size: 14px;
  text-align: center;
  padding: 15px;
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

button {
  flex: 1;
  min-width: 0;
  padding: 13px 5px;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#stop {
  background: #d32f2f;
}

#choose {
  width: 100%;
  margin-top: 10px;
}

#photoInput {
  display: none;
}

#status {
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
  color: #555;
  margin: 15px 0;
}

.result {
  padding: 17px 10px;
  background: #eaf5ec;
  border-radius: 11px;
  text-align: center;
  margin: 12px 0 20px;
}

.result-title {
  font-size: 13px;
  margin-bottom: 8px;
}

#bestName {
  font-size: 23px;
  font-weight: 700;
  color: #176b32;
  overflow-wrap: anywhere;
}

#bestPercent {
  font-size: 14px;
  margin-top: 6px;
  color: #444;
}

h2 {
  font-size: 17px;
  margin: 20px 0 15px;
}

.label-item {
  margin-bottom: 16px;
}

.label-heading {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 14px;
  margin-bottom: 7px;
}

.label-name {
  font-weight: 600;
}

.label-percent {
  white-space: nowrap;
}

.track {
  height: 12px;
  background: #e6e6e6;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: #2196f3;
  border-radius: 20px;
  transition: width .2s;
}

.note {
  border-top: 1px solid #eee;
  padding-top: 13px;
  margin-top: 20px;
  font-size: 12px;
  color: #777;
  text-align: center;
  line-height: 1.6;
}

@media (max-width: 400px) {
  #app {
    padding: 13px;
  }

  h1 {
    font-size: 21px;
  }

  button {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div id="app">

  <h1>AI PHÂN LOẠI RÁC</h1>

  <div class="description">
    Đưa vật thể vào camera để AI nhận diện loại rác.
  </div>

  <div id="camera">
    <video id="video" autoplay muted playsinline></video>
    <img id="preview" alt="Ảnh cần phân loại">
    <div id="placeholder">Camera chưa được bật</div>
  </div>

  <div class="buttons">
    <button id="start">Bật camera</button>
    <button id="switch" disabled>Đổi camera</button>
    <button id="stop" disabled>Tắt camera</button>
  </div>

  <button id="choose">Chụp / chọn ảnh</button>
  <input id="photoInput" type="file" accept="image/*" capture="environment">

  <div id="status">Nhấn Bật camera để bắt đầu.</div>

  <div class="result">
    <div class="result-title">KẾT QUẢ NHẬN DIỆN</div>
    <div id="bestName">Chưa có kết quả</div>
    <div id="bestPercent"></div>
  </div>

  <h2>CHI TIẾT KẾT QUẢ</h2>

  <div id="labels"></div>

  <div class="note">
    Kết quả AI chỉ mang tính tham khảo.
    Hãy kiểm tra vật thể trước khi phân loại rác thực tế.
  </div>

</div>

<script>
(function () {

  const MODEL_URL =
    "https://teachablemachine.withgoogle.com/models/AKXp-jRAe/";

  const video = document.getElementById("video");
  const preview = document.getElementById("preview");
  const placeholder = document.getElementById("placeholder");

  const startBtn = document.getElementById("start");
  const switchBtn = document.getElementById("switch");
  const stopBtn = document.getElementById("stop");
  const chooseBtn = document.getElementById("choose");
  const photoInput = document.getElementById("photoInput");

  const status = document.getElementById("status");
  const labels = document.getElementById("labels");

  const bestName = document.getElementById("bestName");
  const bestPercent = document.getElementById("bestPercent");

  // Canvas giống cách xử lý của Teachable Machine gốc
  const canvas = document.createElement("canvas");
  canvas.width = 200;
  canvas.height = 200;

  const ctx = canvas.getContext("2d");

  let model = null;
  let stream = null;
  let running = false;
  let busy = false;
  let facing = "environment";
  let animationId = null;
  let photoURL = null;

  async function loadModel() {
    if (model) return;

    status.textContent = "Đang tải mô hình AI...";

    model = await tmImage.load(
      MODEL_URL + "model.json",
      MODEL_URL + "metadata.json"
    );

    labels.replaceChildren();

    for (let i = 0; i < model.getTotalClasses(); i++) {

      const item = document.createElement("div");
      item.className = "label-item";

      const heading = document.createElement("div");
      heading.className = "label-heading";

      const name = document.createElement("span");
      name.className = "label-name";

      const percent = document.createElement("span");
      percent.className = "label-percent";

      heading.append(name, percent);

      const track = document.createElement("div");
      track.className = "track";

      const bar = document.createElement("div");
      bar.className = "bar";

      track.appendChild(bar);
      item.append(heading, track);

      labels.appendChild(item);
    }
  }

  // Chuyển ảnh về canvas 200x200
  // Giữ cách xử lý gần với webcam.canvas của code gốc
  function drawToCanvas(source, flip) {

    ctx.save();
    ctx.clearRect(0, 0, 200, 200);

    if (flip) {
      ctx.translate(200, 0);
      ctx.scale(-1, 1);
    }

    ctx.drawImage(source, 0, 0, 200, 200);
    ctx.restore();
  }

  async function predict(source, flip = false) {

    if (!model || busy) return;

    busy = true;

    try {

      drawToCanvas(source, flip);

      // Giữ nguyên cách dự đoán của code gốc
      const prediction = await model.predict(canvas);

      let best = prediction[0];

      prediction.forEach((p, i) => {

        if (p.probability > best.probability) {
          best = p;
        }

        const item = labels.children[i];

        item.querySelector(".label-name").textContent =
          p.className;

        item.querySelector(".label-percent").textContent =
          (p.probability * 100).toFixed(1) + "%";

        item.querySelector(".bar").style.width =
          (p.probability * 100) + "%";
      });

      bestName.textContent = best.className;

      bestPercent.textContent =
        "Độ tin cậy dự đoán: " +
        (best.probability * 100).toFixed(1) + "%";

    } catch (error) {
      console.error(error);
      status.textContent = "Không thể nhận diện hình ảnh.";
    }

    busy = false;
  }

  async function startCamera() {

    if (running) return;

    startBtn.disabled = true;

    try {

      await loadModel();

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error("CAMERA_UNAVAILABLE");
      }

      status.textContent = "Đang mở camera...";

      stream = await navigator.mediaDevices.getUserMedia({

        audio: false,

        video: {
          facingMode: { ideal: facing },
          width: { ideal: 640 },
          height: { ideal: 480 }
        }

      });

      video.srcObject = stream;
      await video.play();

      video.style.display = "block";
      preview.style.display = "none";
      placeholder.style.display = "none";

      running = true;

      startBtn.disabled = true;
      switchBtn.disabled = false;
      stopBtn.disabled = false;

      status.textContent =
        "Camera đang hoạt động. Hãy đưa vật thể vào khung hình.";

      loop();

    } catch (error) {

      console.error(error);

      stopCamera();

      if (error.message === "CAMERA_UNAVAILABLE") {
        status.textContent =
          "Trình duyệt không hỗ trợ truy cập camera. Hãy chọn ảnh.";
      } else if (error.name === "NotAllowedError") {
        status.textContent =
          "Camera bị từ chối quyền truy cập. Hãy kiểm tra quyền camera.";
      } else if (error.name === "NotFoundError") {
        status.textContent = "Không tìm thấy camera.";
      } else {
        status.textContent =
          "Không thể mở camera. Hãy thử chọn ảnh.";
      }
    }
  }

  async function loop() {

    if (!running) return;

    if (!busy && video.readyState >= 2) {
      await predict(video, true);
    }

    if (running) {
      animationId = requestAnimationFrame(loop);
    }
  }

  function stopCamera() {

    running = false;

    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.pause();
    video.srcObject = null;
    video.style.display = "none";

    startBtn.disabled = false;
    switchBtn.disabled = true;
    stopBtn.disabled = true;

    placeholder.style.display = "block";
    placeholder.textContent = "Camera chưa được bật";
  }

  async function switchCamera() {

    if (!running) return;

    facing = facing === "environment" ? "user" : "environment";

    stopCamera();

    await startCamera();
  }

  async function choosePhoto() {

    try {
      await loadModel();
      photoInput.click();
    } catch (error) {
      status.textContent = "Không tải được mô hình AI.";
    }
  }

  photoInput.addEventListener("change", async function () {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      status.textContent = "Vui lòng chọn ảnh hợp lệ.";
      return;
    }

    stopCamera();

    if (photoURL) {
      URL.revokeObjectURL(photoURL);
    }

    photoURL = URL.createObjectURL(file);

    preview.onload = async function () {

      preview.style.display = "block";
      video.style.display = "none";
      placeholder.style.display = "none";

      status.textContent = "Đang phân tích ảnh...";

      await predict(preview, false);

      status.textContent =
        "Đã hoàn thành nhận diện hình ảnh.";
    };

    preview.onerror = function () {
      status.textContent = "Không thể đọc ảnh.";
    };

    preview.src = photoURL;

    this.value = "";
  });

  startBtn.addEventListener("click", startCamera);
  switchBtn.addEventListener("click", switchCamera);
  stopBtn.addEventListener("click", stopCamera);
  chooseBtn.addEventListener("click", choosePhoto);

  window.addEventListener("pagehide", stopCamera);

})();
</script>

</body>
</html>
